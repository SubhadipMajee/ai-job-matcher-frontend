<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Career Co-Pilot — Job Search OS</title>
    <!-- Tailwind CSS CDN with forms & container queries plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Inter & Newsreader -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              serif: ['Newsreader', 'Georgia', 'serif'],
            },
            colors: {
              brand: {
                gold: '#F59E0B',
                'gold-light': '#FBBF24',
                'gold-dim': '#78350F',
                dark: '#080C14',
                surface: '#0D1320',
                card: '#101827',
                panel: '#0B1019',
                border: '#1D2A3F',
                'border-subtle': '#151E2E',
                tag: '#1A2438',
                sidebar: '#09111F',
              }
            },
            screens: {
              'xs': '480px',
            }
          }
        }
      }
    </script>
    <style>
      /* === FULL-WIDTH OS BASE === */
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
        background-color: #080C14;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background-color: #080C14;
        background-image:
          radial-gradient(ellipse 80% 40% at 50% -10%, rgba(245, 158, 11, 0.07) 0%, transparent 70%),
          radial-gradient(ellipse 40% 30% at 90% 20%, rgba(59, 130, 246, 0.04) 0%, transparent 50%),
          radial-gradient(ellipse 30% 25% at 10% 80%, rgba(139, 92, 246, 0.03) 0%, transparent 50%);
        color: #E2E8F0;
        min-height: 100vh;
      }

      /* === SCROLLBAR === */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: #080C14; }
      ::-webkit-scrollbar-thumb { background: #1D2A3F; border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: #2D3E5A; }

      /* === NO SCROLLBAR HELPER === */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* === SIDEBAR LAYOUT === */
      .app-shell {
        display: grid;
        grid-template-columns: 240px 1fr;
        grid-template-rows: 56px 1fr;
        grid-template-areas:
          "topbar topbar"
          "sidebar content";
        min-height: 100vh;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }
      @media (max-width: 1023px) {
        .app-shell {
          display: flex;
          flex-direction: column;
          min-height: 100vh;
          width: 100%;
          max-width: 100vw;
        }
        .app-sidebar { display: none !important; }
        .mobile-tab-bar { display: flex !important; }
      }

      .app-topbar  { grid-area: topbar; width: 100%; }
      .app-sidebar { grid-area: sidebar; }
      .app-content {
        grid-area: content;
        min-width: 0;
        width: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }

      /* === SIDEBAR NAV === */
      .app-sidebar {
        position: sticky;
        top: 56px;
        height: calc(100vh - 56px);
        overflow-y: auto;
        border-right: 1px solid #1D2A3F;
        background: #09111F;
        display: flex;
        flex-direction: column;
        padding: 20px 12px;
        gap: 4px;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
        color: #64748b;
        cursor: pointer;
        transition: all 0.15s ease;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .nav-item:hover {
        color: #e2e8f0;
        background: rgba(255,255,255,0.04);
        border-color: #1D2A3F;
      }
      .nav-item.active {
        color: #fbbf24;
        background: rgba(245, 158, 11, 0.08);
        border-color: rgba(245, 158, 11, 0.25);
      }
      .nav-item .nav-icon { font-size: 16px; flex-shrink: 0; }

      /* === UTILITY CLASSES === */
      .glass-panel {
        background: rgba(13, 19, 32, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .gold-glow { text-shadow: 0 0 30px rgba(245, 158, 11, 0.2); }
      .surface-card {
        background: #101827;
        border: 1px solid #1D2A3F;
        border-radius: 14px;
      }
      .surface-card-hover {
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .surface-card-hover:hover {
        border-color: #2D3E5A;
        box-shadow: 0 4px 24px rgba(0,0,0,0.3);
      }

      /* === KANBAN CARDS === */
      .kanban-card { transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
      .kanban-card:hover {
        transform: translateY(-2px);
        border-color: rgba(245, 158, 11, 0.3);
        box-shadow: 0 8px 20px -4px rgba(0,0,0,0.4), 0 0 12px -2px rgba(245, 158, 11, 0.08);
      }

      /* === JOB CARD === */
      .job-card {
        background: #101827;
        border: 1px solid #1D2A3F;
        border-radius: 12px;
        transition: all 0.15s ease;
      }
      .job-card:hover { border-color: #2D3E5A; }
      .job-card.is-open { border-color: rgba(245, 158, 11, 0.2); }

      /* === INPUT FOCUS RING === */
      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: rgba(245, 158, 11, 0.6) !important;
        box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.1);
      }

      /* === MOBILE TAB BAR === */
      .mobile-tab-bar {
        display: none;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        z-index: 50;
        background: rgba(9, 17, 31, 0.94);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid #1D2A3F;
        padding: 6px 8px;
        padding-bottom: max(6px, env(safe-area-inset-bottom));
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
      }

      /* === STAT CARD SHIMMER === */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      /* === SCROLLABLE CONTENT AREA === */
      .app-content {
        overflow-y: auto;
        min-height: calc(100vh - 56px);
      }
    </style>
  </head>
  <body class="font-sans antialiased text-slate-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
